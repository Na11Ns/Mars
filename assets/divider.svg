<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="100%">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff8fb8"/><stop offset="0.5" stop-color="#b9a2ff"/><stop offset="1" stop-color="#ff8fb8"/>
</linearGradient>
<linearGradient id="dv" x1="0" x2="1"><stop offset="0" stop-color="#ff8fb8" stop-opacity="0"/><stop offset=".5" stop-color="#ff8fb8"/><stop offset="1" stop-color="#b9a2ff" stop-opacity="0"/></linearGradient></defs>
<line x1="0" y1="20" x2="1000" y2="20" stroke="url(#dv)" stroke-width="2"/>
<g filter="url(#glow)"><circle cy="20" r="4" fill="#ffd6e5"><animate attributeName="cx" values="0;1000" dur="3.5s" repeatCount="indefinite"/></circle>
<circle cy="20" r="3" fill="#b9a2ff"><animate attributeName="cx" values="1000;0" dur="5s" repeatCount="indefinite"/></circle></g>
<path d="M500,10 Q502.2,17.8 510,20 Q502.2,22.2 500,30 Q497.8,22.2 490,20 Q497.8,17.8 500,10Z" fill="#ff8fb8" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0 500 20;45 500 20;90 500 20" dur="2.4s" begin="0s" repeatCount="indefinite"/></path>
</svg>
