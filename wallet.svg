<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff8fb8"/><stop offset="0.5" stop-color="#b9a2ff"/><stop offset="1" stop-color="#ff8fb8"/>
</linearGradient>
<linearGradient id="spin" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#ff8fb8"/><stop offset=".5" stop-color="#b9a2ff"/><stop offset="1" stop-color="#7cf5c4"/>
 <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="4s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="bgw" x1="0" x2="1"><stop offset="0" stop-color="#1a0f22"/><stop offset="1" stop-color="#0a0610"/></linearGradient>
</defs>
<rect x="3" y="3" width="994" height="144" rx="22" fill="url(#bgw)"/>
