 <animate attributeName="stroke-dashoffset" values="0;-2480" dur="5s" repeatCount="indefinite"/></rect>
<g transform="translate(70,75)">
 <circle r="38" fill="#ff8fb8" opacity=".15"><animate attributeName="r" values="30;44;30" dur="2.4s" repeatCount="indefinite"/></circle>
